name: Integration tests

on:
  pull_request:
    branches:
      - master
      - prerelease
  workflow_dispatch:

jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'prepare-')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Use Podman Compose instead of Docker Compose
        # pipx: Ubuntu's podman-compose package predates --wait. The extension tries Docker Compose
        # before Podman, so remove the runner's Docker Compose.
        run: |
          pipx install podman-compose
          sudo apt-get remove -y docker-compose-plugin
      - name: Start IRIS containers
        run: podman-compose -f test-fixtures/iris/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Run integration tests
        run: xvfb-run npm test
      - name: Show IRIS logs
        if: failure()
        run: podman-compose -f test-fixtures/iris/docker-compose.yml logs
      - name: Remove IRIS containers
        if: always()
        run: podman-compose -f test-fixtures/iris/docker-compose.yml down -v
